name: 发布 Windows 安装包

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 测试、构建与打包
        shell: pwsh
        run: npm run release
      - name: 发布安装附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = 'v' + $version
          $title = 'DSH 计费账本 ' + $version + ' · Windows'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = "下载 Windows ZIP，完整解压后按 README 运行 install.ps1，再重新打开 DSH。`n`n"
          $notes += "支持范围见 README；Chatbox 固定折算为每百万点 9.375 CNY，费用为估算。`n`n"
          $notes += (Get-Content CHANGELOG.md -Raw)
          $notes += "`n`n## SHA-256`n`n``````text`n" + (Get-Content dist/SHA256SUMS.txt -Raw) + "```````n"
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $assets = @(
            "dist/dsh-billing-ledger-$version-windows.zip",
            "dist/dsh-billing-ledger-$version.tgz",
            'dist/SHA256SUMS.txt'
          )
          $releases = & gh release list --repo $env:GH_REPO --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw '无法查询发布状态。' }
          $existing = @($releases | Out-String | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag }) | Select-Object -First 1
          if ($existing -and -not $existing.isDraft) { throw '该版本已发布；请更新 package.json 版本后再发布。' }
          if ($existing) {
            & gh release upload $tag @assets --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw '发布附件上传失败。' }
            & gh release edit $tag --repo $env:GH_REPO --draft=false --latest --target $env:GITHUB_SHA --title $title --notes-file $notesPath
          } else {
            & gh release create $tag @assets --repo $env:GH_REPO --target $env:GITHUB_SHA --title $title --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw '发布失败。' }
          "已发布：https://github.com/$env:GH_REPO/releases/tag/$tag" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
